<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chomiedos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#e7efe9;--panel:#fff;--ink:#0f2418;--mute:#5a6f62;--line:#d2e0d6;--acc:#12804a;--onacc:#fff;--hd:#0e6b3d;--live:#d33b3b}
@media(prefers-color-scheme:dark){:root{--bg:#0b1410;--panel:#13201a;--ink:#e5f1e9;--mute:#8da699;--line:#223529;--acc:#2fcf7a;--onacc:#06220f;--hd:#0b5a33;--live:#ff6b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif}
header{background:var(--hd);color:#fff;padding:16px 0 14px;margin-bottom:14px}
header div{max-width:960px;margin:auto;padding:0 16px}
h1{margin:0;font:700 36px 'Barlow Condensed',Arial Narrow,sans-serif;letter-spacing:.5px}
header p{margin:0;color:rgba(255,255,255,.8)}
.wrap{max-width:960px;margin:auto;padding:0 12px 40px;display:grid;grid-template-columns:190px 1fr;gap:14px;align-items:start}
nav{display:flex;flex-direction:column;gap:2px}
nav button{text-align:left;border:0;background:none;color:var(--ink);font:500 16px Barlow,sans-serif;padding:9px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button:hover{background:var(--line)}
nav button.on{background:var(--acc);color:var(--onacc)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font:600 20px 'Barlow Condensed',sans-serif;padding:12px;cursor:pointer;border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
.sub{display:flex;gap:8px;padding:12px 14px 0}
.sub button{border:1px solid var(--line);background:none;color:var(--ink);font:500 15px Barlow,sans-serif;padding:6px 14px;border-radius:999px;cursor:pointer}
.sub button.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.fecha{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.fecha div{text-align:center}
.fecha b{display:block;font:700 24px 'Barlow Condensed',sans-serif}
.fecha b::first-letter{text-transform:uppercase}
.fecha span{color:var(--mute);font-size:14px}
.fecha button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);font-size:22px;cursor:pointer}
.fecha button:disabled{opacity:.3;cursor:default}
.mw{border-bottom:1px solid var(--line)}
.mw:last-child{border:0}
.m{display:grid;grid-template-columns:1fr 78px 1fr;align-items:center;gap:8px;padding:13px 14px}
.m .h,.g .h{text-align:right}
.sc{text-align:center;font:700 28px 'Barlow Condensed',sans-serif;letter-spacing:1px}
.sc.next{font-size:17px;color:var(--mute);font-weight:600}
.vivo{display:block;font:600 12px Barlow,sans-serif;color:var(--live);letter-spacing:0}
.w{font-weight:500;color:var(--acc)}
.g{display:grid;grid-template-columns:1fr 78px 1fr;gap:8px;padding:0 14px 12px;font-size:13px;line-height:1.35;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:9px 6px;text-align:center}
th{color:var(--mute);font-weight:500;font-size:13px;border-bottom:1px solid var(--line)}
td:nth-child(2),th:nth-child(2){text-align:left;width:100%}
td:last-child{font:700 19px 'Barlow Condensed',sans-serif}
tbody tr{border-bottom:1px solid var(--line)}
.ley{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 14px;font-size:13px;color:var(--mute)}
.ley i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.nota{padding:12px 14px;color:var(--mute);font-size:13px}
@media(max-width:700px){
.wrap{grid-template-columns:1fr}
nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}
.gf{display:none}
}
</style>
</head>
<body>
<header><div>
  <h1>Chomiedos</h1>
  <p>Resultados y tablas de posiciones</p>
</div></header>
<div class="wrap">
  <nav id="nav" aria-label="Ligas"></nav>
  <main id="main"></main>
</div>

<script>
/* Para agregar una liga: sumá una línea acá con su código de ESPN
   (y la misma en actualizar.py). */
const LIGAS = [
  {n:'Liga Argentina', espn:'arg.1'},
  {n:'Primera Nacional', espn:'arg.2'},
  {n:'Brasileirão', espn:'bra.1'},
  {n:'Liga Uruguaya', espn:'uru.1'},
  {n:'Premier League', espn:'eng.1'},
  {n:'LaLiga', espn:'esp.1'},
  {n:'Serie A', espn:'ita.1'},
  {n:'Bundesliga', espn:'ger.1'},
  {n:'Ligue 1', espn:'fra.1'}
];
const S = {liga:0, vista:'partidos', sub:'torneo', dia:{}, tk:0}; // dia: día elegido en cada liga
const cache = {};
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const color = c => /^#[0-9a-f]{6}$/i.test(c) ? c : '#888888';
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function diaTexto(dia){
  const man = new Date(), ayer = new Date();
  man.setDate(man.getDate()+1); ayer.setDate(ayer.getDate()-1);
  const etiqueta = dia===iso(new Date()) ? 'Hoy' : dia===iso(man) ? 'Mañana' : dia===iso(ayer) ? 'Ayer' : '';
  const txt = new Date(dia+'T12:00').toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'long'});
  return {etiqueta, txt};
}

/* ===== Datos: datos/<liga>.json, que mantiene actualizar.py ===== */
function armar(raw){
  const j = JSON.parse(raw);
  j.raw = raw;
  j.dias = [...new Set(j.partidos.map(p => p.dia))].sort(); // solo días con partidos: los vacíos se saltean
  return j;
}
async function datosLiga(slug){
  if(!cache[slug]){
    const r = await fetch(`datos/${slug}.json`, {cache:'no-cache'});
    if(!r.ok) throw new Error(`no se encontró datos/${slug}.json (${r.status})`);
    cache[slug] = armar(await r.text());
  }
  return cache[slug];
}

function irDia(n){
  const slug = LIGAS[S.liga].espn, dias = cache[slug].dias;
  S.dia[slug] = dias[Math.min(dias.length-1, Math.max(0, dias.indexOf(S.dia[slug]) + n))];
  render();
}

/* ===== Piezas de la pantalla ===== */
function htmlTabla(filas){
  const ley = [], vistos = {};
  filas.forEach(f => { if(f.nota && !vistos[f.nota.d]){ vistos[f.nota.d] = 1; ley.push(f.nota); } });
  return `<table><thead><tr><th>#</th><th>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th>
    <th class="gf">GF</th><th class="gf">GC</th><th>DG</th><th>Pts</th></tr></thead><tbody>` +
    filas.map((t,i) => `<tr><td${t.nota ? ` style="box-shadow:inset 4px 0 ${color(t.nota.c)}"` : ''}>${i+1}</td>
      <td>${esc(t.n)}</td><td>${t.pj}</td><td>${t.g}</td><td>${t.e}</td><td>${t.p}</td>
      <td class="gf">${t.gf}</td><td class="gf">${t.gc}</td><td>${t.dg>0?'+':''}${t.dg}</td><td>${t.pts}</td></tr>`).join('') +
    `</tbody></table>` +
    (ley.length ? `<div class="ley">${ley.map(n => `<span><i style="background:${color(n.c)}"></i>${esc(n.d)}</span>`).join('')}</div>` : '');
}

// Goleadores de un lado del partido: "Nombre 23', 45' (p)"
function golesDe(p, lado){
  const por = {};
  (p.goles || []).filter(g => g.l === lado).forEach(g => {
    const n = g.n || 'Gol';
    (por[n] = por[n] || []).push(g.m + (g.t === 'p' ? ' (p)' : g.t === 'e' ? ' (e.c.)' : ''));
  });
  return Object.entries(por).map(([n, m]) => `${esc(n)} ${esc(m.join(', '))}`).join('<br>');
}

function htmlPartido(p){
  const jug = p.estado !== 'pre', gl = jug && +p.gl > +p.gv, gv = jug && +p.gv > +p.gl;
  const susp = p.estado === 'post' && !p.completo;
  const centro = !jug ? new Date(p.fecha).toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'})
               : susp ? esc(p.detalle) : `${p.gl} - ${p.gv}`;
  const vivo = p.estado === 'in' ? `<small class="vivo">${esc(p.detalle)}</small>` : '';
  const gH = golesDe(p, 'h'), gV = golesDe(p, 'v');
  return `<div class="mw"><div class="m"><span class="h ${gl?'w':''}">${esc(p.h)}</span>
    <span class="sc ${jug && !susp ? '' : 'next'}">${centro}${vivo}</span>
    <span class="${gv?'w':''}">${esc(p.v)}</span></div>` +
    (gH || gV ? `<div class="g"><span class="h">${gH}</span><span></span><span>${gV}</span></div>` : '') + `</div>`;
}

/* ===== Pantalla ===== */
function render(){
  const tk = ++S.tk, slug = LIGAS[S.liga].espn;
  document.getElementById('nav').innerHTML = LIGAS.map((l,i) =>
    `<button class="${i===S.liga?'on':''}" onclick="S.liga=${i};render()">${l.n}</button>`).join('');
  const cab = `<div class="tabs">
    <button class="${S.vista==='partidos'?'on':''}" onclick="S.vista='partidos';render()">Partidos</button>
    <button class="${S.vista==='tabla'?'on':''}" onclick="S.vista='tabla';render()">Posiciones</button></div>`;
  if(!cache[slug]) document.getElementById('main').innerHTML = cab + '<p class="nota">Cargando datos…</p>';
  cargar(cab, tk, slug);
}

async function cargar(cab, tk, slug){
  let h = cab;
  try{
    const D = await datosLiga(slug);
    if(S.vista === 'partidos'){
      const dias = D.dias;
      if(!dias.length){ h += '<p class="nota">Todavía no hay partidos cargados.</p>'; }
      else {
        if(!dias.includes(S.dia[slug])) S.dia[slug] = dias.find(d => d >= iso(new Date())) || dias[dias.length-1];
        const dia = S.dia[slug], i = dias.indexOf(dia), {etiqueta, txt} = diaTexto(dia);
        h += `<div class="fecha">
          <button onclick="irDia(-1)" aria-label="Día anterior" ${i===0?'disabled':''}>‹</button>
          <div><b>${etiqueta || txt}</b><span>${etiqueta ? txt : ''}</span></div>
          <button onclick="irDia(1)" aria-label="Día siguiente" ${i===dias.length-1?'disabled':''}>›</button></div>`;
        h += D.partidos.filter(p => p.dia === dia).map(htmlPartido).join('');
      }
    } else {
      if(D.anual){
        h += `<div class="sub">` + [['torneo','Torneo actual'],['anual','Tabla anual']].map(([k,t]) =>
          `<button class="${S.sub===k?'on':''}" onclick="S.sub='${k}';render()">${t}</button>`).join('') + `</div>`;
      }
      if(D.anual && S.sub === 'anual'){
        h += htmlTabla(D.anual) + `<p class="nota">Suma la fase regular del Apertura y del Clausura (los playoffs no cuentan).
          * Los cupos se corren si algún equipo ya clasificó por otra vía (campeones, Copa Argentina). También desciende el último
          de la tabla de promedios; si es el mismo equipo, baja el anteúltimo de la anual.</p>`;
      } else {
        h += D.tabla.map(g => (g.nombre ? `<p class="nota"><b>${esc(g.nombre)}</b></p>` : '') + htmlTabla(g.filas)).join('');
      }
    }
    h += `<p class="nota">Datos de ESPN. Última novedad: ${new Date(D.actualizado).toLocaleString('es-AR')}.</p>`;
  } catch(err){
    h += `<p class="nota">No se pudieron cargar los datos (${esc(err.message)}). Esto solo funciona con la página publicada en GitHub Pages, no abriendo el archivo con doble click.</p>`;
  }
  if(tk === S.tk) document.getElementById('main').innerHTML = h;
}

// Cada 60 segundos revisa si hay datos nuevos y, si los hay, redibuja sola
setInterval(async () => {
  if(document.hidden) return;
  const slug = LIGAS[S.liga].espn;
  try{
    const r = await fetch(`datos/${slug}.json`, {cache:'no-cache'});
    if(!r.ok) return;
    const raw = await r.text();
    if(raw !== cache[slug]?.raw){ cache[slug] = armar(raw); render(); }
  } catch(e){}
}, 60000);

render();
</script>
</body>
</html>
