<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chomiedos: resultados y posiciones de fútbol</title>
<meta name="description" content="Resultados, goles y tablas de posiciones de fútbol argentino, brasileño, uruguayo y europeo.">
<meta name="theme-color" content="#0e6b3d">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%230e6b3d'/%3E%3Ccircle%20cx='32'%20cy='32'%20r='23'%20fill='%23fff'/%3E%3Cpath%20d='M32%2020.5l9.5%206.9-3.6%2011.2H26.1l-3.6-11.2z'%20fill='%230e6b3d'/%3E%3Cpath%20d='M32%2020.5V9.5M41.5%2027.4l10.2-3.3M37.9%2038.6l6.3%208.7M26.1%2038.6l-6.3%208.7M22.5%2027.4l-10.2-3.3'%20stroke='%230e6b3d'%20stroke-width='3'%20stroke-linecap='round'%20fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#e7efe9;--panel:#fff;--ink:#0f2418;--mute:#566a5d;--line:#d2e0d6;--acc:#12804a;--onacc:#fff;--hd:#0e6b3d;--hd2:#0b5a33;--live:#c62828;--tint:#eef6f1}
@media(prefers-color-scheme:dark){:root{--bg:#0b1410;--panel:#13201a;--ink:#e8f3ec;--mute:#9bb3a5;--line:#243a2d;--acc:#2fcf7a;--onacc:#06220f;--hd:#0b5a33;--hd2:#08452a;--live:#ff7b7b;--tint:#182a21}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 Barlow,system-ui,'Segoe UI',sans-serif}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-70px;z-index:30;background:var(--acc);color:var(--onacc);padding:10px 16px;border-radius:8px;font-weight:500}
.skip:focus{top:12px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
abbr{text-decoration:none}
.hero{position:relative;overflow:hidden;color:#fff;background:repeating-linear-gradient(90deg,var(--hd) 0 56px,var(--hd2) 56px 112px)}
.hero::before{content:"";position:absolute;right:92px;top:0;bottom:0;border-right:3px solid rgba(255,255,255,.2)}
.hero::after{content:"";position:absolute;right:-8px;top:50%;width:190px;height:190px;margin-top:-95px;border:3px solid rgba(255,255,255,.2);border-radius:50%}
.hero-in{position:relative;z-index:1;max-width:760px;margin:auto;padding:26px 16px;display:flex;align-items:center;gap:16px}
.logo{width:68px;height:68px;flex:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
h1{margin:0;font:italic 700 clamp(44px,11vw,68px)/.95 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.5px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.hero p{margin:6px 0 0;font-size:18px}
.wrap{max-width:760px;margin:0 auto;padding:16px 12px 48px}
.liga-menu{position:relative;margin-bottom:14px}
.liga-btn{width:100%;min-height:58px;display:flex;align-items:center;gap:12px;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:8px 16px;font:600 24px 'Barlow Condensed',sans-serif;text-align:left;cursor:pointer}
.liga-btn:hover{border-color:var(--acc)}
.cod{display:inline-block;min-width:46px;text-align:center;background:var(--acc);color:var(--onacc);border-radius:7px;padding:2px 6px;font:600 15px Barlow,sans-serif}
.nom{flex:1}
.flecha{width:12px;height:12px;margin:-5px 4px 0;border-right:3px solid currentColor;border-bottom:3px solid currentColor;transform:rotate(45deg);transition:transform .2s,margin .2s}
.liga-btn[aria-expanded=true] .flecha{transform:rotate(-135deg);margin-top:5px}
.liga-lista{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 6px);max-height:70vh;overflow:auto;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 12px 30px rgba(0,0,0,.22)}
.grupo{margin:10px 10px 4px;font:600 15px Barlow,sans-serif;color:var(--mute)}
.op{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;border:0;border-radius:10px;background:none;color:var(--ink);padding:6px 10px;font:500 19px Barlow,sans-serif;text-align:left;cursor:pointer}
.op:hover,.op.on{background:var(--tint)}
.op.on{font-weight:600}
.op.on::after{content:"✓";margin-left:auto;color:var(--acc);font-weight:700}
main{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.07)}
main:focus{outline:none}
.seg{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.seg button{flex:1;min-height:50px;border:2px solid var(--line);border-radius:12px;background:none;color:var(--ink);font:600 21px 'Barlow Condensed',sans-serif;cursor:pointer}
.seg button:hover{border-color:var(--acc)}
.seg button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.seg.chico{border:0;padding:12px 12px 0}
.seg.chico button{min-height:44px;font:500 17px Barlow,sans-serif;border-radius:999px}
.fecha{display:flex;align-items:center;justify-content:space-between;padding:12px;background:var(--tint);border-bottom:1px solid var(--line)}
.fecha div{text-align:center}
.fecha h3{margin:0;font:700 30px/1.1 'Barlow Condensed',sans-serif}
.fecha h3::first-letter{text-transform:uppercase}
.fecha span{color:var(--mute);font-size:16px}
.fecha button{width:50px;height:50px;border:2px solid var(--line);border-radius:50%;background:var(--panel);color:var(--ink);font-size:28px;line-height:1;cursor:pointer}
.fecha button:hover:not(:disabled){border-color:var(--acc)}
.fecha button:disabled{opacity:.35;cursor:default}
.lista{list-style:none;margin:0;padding:0}
.mw{border-bottom:1px solid var(--line)}
.mw:last-child{border:0}
.mw.envivo{background:color-mix(in srgb,var(--live) 9%,transparent);box-shadow:inset 5px 0 var(--live)}
.m{display:grid;grid-template-columns:1fr 100px 1fr;align-items:center;gap:8px;padding:16px 14px 8px}
.eq{font-size:19px;font-weight:500;line-height:1.2}
.h{text-align:right}
.sc{text-align:center;font:700 38px/1 'Barlow Condensed',sans-serif;letter-spacing:1px}
.sc.next{font-size:25px;color:var(--mute);font-weight:600}
.est{display:block;white-space:nowrap;margin-top:5px;font:500 14px Barlow,sans-serif;letter-spacing:0;color:var(--mute)}
.est.vivo{color:var(--live);font-weight:600}
.punto{display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:50%;background:var(--live)}
@media(prefers-reduced-motion:no-preference){.punto{animation:late 1.4s infinite}@keyframes late{50%{opacity:.2}}}
.w{color:var(--acc);font-weight:700}
.g{display:grid;grid-template-columns:1fr 100px 1fr;gap:8px;padding:0 14px 14px;font-size:15px;line-height:1.35;color:var(--mute)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:17px}
th,td{padding:12px 6px;text-align:center}
th{color:var(--mute);font-weight:500;font-size:14px;border-bottom:2px solid var(--line)}
td:nth-child(2),th:nth-child(2){text-align:left;width:100%}
tbody tr{border-bottom:1px solid var(--line)}
tbody tr:nth-child(even){background:var(--tint)}
td:last-child{font:700 24px 'Barlow Condensed',sans-serif;color:var(--acc)}
.ley{display:flex;flex-wrap:wrap;gap:8px 18px;padding:12px 14px;font-size:15px;color:var(--mute)}
.ley i{display:inline-block;width:12px;height:12px;margin-right:7px;border-radius:3px}
.nota{margin:0;padding:12px 14px;color:var(--mute);font-size:15px}
@media(max-width:560px){
.gf{display:none}
.hero::before,.hero::after{display:none}
.m,.g{grid-template-columns:1fr 92px 1fr}
.eq{font-size:17px}
.sc{font-size:34px}
}
</style>
</head>
<body>
<a class="skip" href="#contenido">Saltar al contenido</a>
<header class="hero"><div class="hero-in">
  <svg class="logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><circle cx="32" cy="32" r="29" fill="#fff"/><path d="M32 18l11.5 8.4-4.4 13.6H24.9l-4.4-13.6z" fill="#0e6b3d"/><path d="M32 18V5M43.5 26.4l12.3-4M39.1 40l7.6 10.5M24.9 40l-7.6 10.5M20.5 26.4l-12.3-4" stroke="#0e6b3d" stroke-width="3.5" stroke-linecap="round" fill="none"/></svg>
  <div>
    <h1>Chomiedos</h1>
    <p>Resultados, goles y posiciones en vivo</p>
  </div>
</div></header>
<div class="wrap">
  <nav class="liga-menu" aria-label="Ligas">
    <button id="ligaBtn" class="liga-btn" aria-expanded="false" aria-controls="ligaLista"></button>
    <div id="ligaLista" class="liga-lista" hidden></div>
  </nav>
  <main id="contenido" tabindex="-1"></main>
</div>

<script>
/* Para agregar una liga: sumá una línea acá con su código de ESPN, la sigla
   que se ve en el menú (cod) y el grupo donde aparece (g), y la misma liga en actualizar.py. */
const LIGAS = [
  {n:'Liga Profesional de Fútbol', espn:'arg.1', cod:'ARG', g:'Argentina'},
  {n:'Primera Nacional', espn:'arg.2', cod:'ARG', g:'Argentina'},
  {n:'Copa Argentina', espn:'arg.copa', cod:'ARG', g:'Argentina'},
  {n:'Brasileirão', espn:'bra.1', cod:'BRA', g:'Brasil'},
  {n:'Copa de Brasil', espn:'bra.copa_do_brazil', cod:'BRA', g:'Brasil'},
  {n:'Liga AUF Uruguaya', espn:'uru.1', cod:'URU', g:'Uruguay'},
  {n:'Copa AUF Uruguay', espn:'uru.copa_auf_uruguay', cod:'URU', g:'Uruguay'},
  {n:'Liga BetPlay Dimayor', espn:'col.1', cod:'COL', g:'Colombia'},
  {n:'Liga de Primera', espn:'chi.1', cod:'CHI', g:'Chile'},
  {n:'CONMEBOL Libertadores', espn:'conmebol.libertadores', cod:'CONMEBOL', g:'Copas internacionales'},
  {n:'CONMEBOL Sudamericana', espn:'conmebol.sudamericana', cod:'CONMEBOL', g:'Copas internacionales'},

  {n:'Premier League', espn:'eng.1', cod:'ING', g:'Europa'},
  {n:'LaLiga', espn:'esp.1', cod:'ESP', g:'Europa'},
  {n:'Serie A', espn:'ita.1', cod:'ITA', g:'Europa'},
  {n:'Bundesliga', espn:'ger.1', cod:'ALE', g:'Europa'},
  {n:'Ligue 1', espn:'fra.1', cod:'FRA', g:'Europa'}
];
/* Casi en tiempo real: pegá acá la dirección de tu Worker de Cloudflare
   (por ejemplo 'https://chomiedos.tuusuario.workers.dev'). Si queda vacío,
   la página usa solo los datos que guarda GitHub. */
const PROXY = 'https://chomiedos.ginozuccotti2009.workers.dev';

// Marcas de posiciones para las tablas que ESPN no marca: [desde, hasta, texto, color].
// Los negativos cuentan desde el final (-1 = último). Es la misma lista que tiene actualizar.py.
const REGLAS = {
  'arg.1': {
    torneo: [[1, 8, 'Playoffs', '#2fa866']],
    anual: [[1, 3, 'Copa Libertadores*', '#2b7bd6'], [4, 9, 'Copa Sudamericana*', '#e3a21a'], [-1, -1, 'Descenso', '#d64545']]
  }
};

const S = {liga:0, vista:'inicio', sub:'torneo', dia:{}, tk:0}; // dia: día elegido en cada liga
const cache = {};
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const color = c => /^#[0-9a-f]{6}$/i.test(c) ? c : '#888888';
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function diaTexto(dia){
  const man = new Date(), ayer = new Date();
  man.setDate(man.getDate()+1); ayer.setDate(ayer.getDate()-1);
  const etiqueta = dia===iso(new Date()) ? 'Hoy' : dia===iso(man) ? 'Mañana' : dia===iso(ayer) ? 'Ayer' : '';
  const txt = new Date(dia+'T12:00').toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'long'});
  return {etiqueta, txt};
}

/* ===== Datos: datos/<liga>.json, que mantiene actualizar.py ===== */
function armar(raw){
  const j = JSON.parse(raw);
  j.raw = raw;
  j.dias = [...new Set(j.partidos.map(p => p.dia))].sort(); // solo días con partidos: los vacíos se saltean
  return j;
}
async function datosLiga(slug){
  if(!cache[slug]){
    const r = await fetch(`datos/${slug}.json`, {cache:'no-cache'});
    if(!r.ok) throw new Error(`no se encontró datos/${slug}.json (${r.status})`);
    cache[slug] = armar(await r.text());
  }
  return cache[slug];
}

/* ===== En vivo (solo si hay PROXY): lee ESPN a través del Worker, igual que actualizar.py ===== */
function marcar(filas, reglas){
  const n = filas.length;
  filas.forEach((f, i) => {
    if(f.nota) return;
    for(const [a, b, d, c] of reglas){
      if((a > 0 ? a : n + a + 1) <= i + 1 && i + 1 <= (b > 0 ? b : n + b + 1)){ f.nota = {d, c}; break; }
    }
  });
}

function leerEventos(j, dia){
  return (j.events || []).map(e => {
    const comp = e.competitions?.[0] || {}, eq = comp.competitors || [], st = e.status?.type || {};
    const L = eq.find(x => x.homeAway === 'home') || eq[0] || {}, V = eq.find(x => x.homeAway === 'away') || eq[1] || {};
    const lado = {[L.team?.id]:'h', [V.team?.id]:'v'};
    const goles = (comp.details || []).filter(d => d.scoringPlay && lado[d.team?.id] && !/shootout/i.test(d.type?.text || ''))
      .map(d => ({l:lado[d.team.id], n:d.athletesInvolved?.[0]?.displayName || d.athletesInvolved?.[0]?.shortName || '',
                  m:d.clock?.displayValue || '', t:d.penaltyKick ? 'p' : d.ownGoal ? 'e' : ''}));
    return {id:e.id, dia, fecha:e.date, h:L.team?.displayName, v:V.team?.displayName, gl:L.score, gv:V.score,
            estado:st.state, completo:st.completed, detalle:st.shortDetail, goles};
  });
}

function leerTabla(j, slug){
  const grupos = j.children?.length ? j.children : [j];
  return grupos.map(g => {
    const filas = (g.standings?.entries || []).map(e => {
      const s = k => Math.trunc(e.stats?.find(x => x.name === k)?.value || 0);
      const fila = {n:e.team?.displayName, pj:s('gamesPlayed'), g:s('wins'), e:s('ties'), p:s('losses'),
                    gf:s('pointsFor'), gc:s('pointsAgainst'), dg:s('pointDifferential'), pts:s('points'), rank:s('rank')};
      if(e.note?.description){
        let c = e.note.color || ''; c = c.startsWith('#') ? c : '#' + c;
        fila.nota = {d:e.note.description, c:color(c)};
      }
      return fila;
    }).sort((a, b) => (a.rank || 99) - (b.rank || 99));
    marcar(filas, REGLAS[slug]?.torneo || []);
    return {nombre: grupos.length > 1 ? g.name : '', filas};
  });
}

// Suma solo la fase regular del Apertura y del Clausura (16 partidos por equipo y torneo)
function tablaAnual(partidos, slug){
  const llevan = {}, filas = {};
  [...partidos].sort((a, b) => (a.fecha || '').localeCompare(b.fecha || '')).forEach(p => {
    if(!p.h || !p.v) return;
    const sem = (p.fecha || '') < '2026-07-01' ? 1 : 2, kh = p.h + '|' + sem, kv = p.v + '|' + sem;
    llevan[kh] = (llevan[kh] || 0) + 1; llevan[kv] = (llevan[kv] || 0) + 1;
    if(llevan[kh] > 16 || llevan[kv] > 16) return;   // playoffs: no cuentan
    for(const n of [p.h, p.v]) filas[n] = filas[n] || {n, pj:0, g:0, e:0, p:0, gf:0, gc:0};
    if(p.estado !== 'post' || !p.completo || p.gl == null || p.gl === '' || p.gv == null || p.gv === '') return;
    const a = +p.gl, b = +p.gv, H = filas[p.h], V = filas[p.v];
    H.pj++; V.pj++; H.gf += a; H.gc += b; V.gf += b; V.gc += a;
    if(a > b){ H.g++; V.p++; } else if(a < b){ V.g++; H.p++; } else { H.e++; V.e++; }
  });
  const orden = Object.values(filas).map(f => ({...f, dg:f.gf - f.gc, pts:f.g * 3 + f.e}))
    .sort((x, y) => y.pts - x.pts || y.dg - x.dg || y.gf - x.gf);
  marcar(orden, REGLAS[slug]?.anual || []);
  return orden;
}

function hayActividad(ps){   // partido en juego, por empezar (15 min) o terminado hace menos de 3 horas
  const ahora = Date.now();
  return ps.some(p => p.estado === 'in' || (Date.parse(p.fecha) >= ahora - 3 * 3600e3 && Date.parse(p.fecha) <= ahora + 15 * 60e3));
}

function esReciente(dia){   // hoy, ayer y mañana: los días que se piden en vivo
  return [-1, 0, 1].map(n => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); }).includes(dia);
}

const vivo = {};   // respuestas recientes, para no repetir el mismo pedido varias veces seguidas
async function pedirVivo(clave, ruta, extra, vence, leer){
  if(!PROXY) return null;
  const c = vivo[clave];
  if(c && Date.now() - c.t < vence) return c.v;
  try{
    const r = await fetch(`${PROXY}?p=${encodeURIComponent(ruta)}${extra}`);
    if(!r.ok) return null;
    const v = leer(await r.json());
    vivo[clave] = {t:Date.now(), v};
    return v;
  } catch(e){ return null; }
}
async function vivoPartidos(slug, dia){   // null si falla o viene vacío: se usan los datos de GitHub
  const ps = await pedirVivo(slug + dia, `site/v2/sports/soccer/${slug}/scoreboard`, `&dates=${dia.replace(/-/g, '')}`, 10000, j => leerEventos(j, dia));
  return ps && ps.length ? ps : null;
}
function vivoTabla(slug){
  return pedirVivo(slug + 'tabla', `v2/sports/soccer/${slug}/standings`, '', 40000, j => leerTabla(j, slug));
}
async function anualEnVivo(D, slug){   // la anual se recalcula con los resultados de hoy y de ayer
  const dias = [0, -1].map(n => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); });
  const res = await Promise.all(dias.map(d => vivoPartidos(slug, d)));
  if(res.every(r => !r)) return null;
  let ps = D.partidos.filter(p => !dias.includes(p.dia));
  dias.forEach((d, i) => { ps = ps.concat(res[i] || D.partidos.filter(p => p.dia === d)); });
  return tablaAnual(ps, slug);
}

// Vuelve a dibujar solo: rápido si hay partidos en juego, despacio si no
let timer;
function programar(ms){
  clearTimeout(timer);
  timer = setTimeout(() => document.hidden ? programar(ms) : render(), ms);
}

function irDia(n){
  const slug = LIGAS[S.liga].espn, dias = cache[slug].dias;
  S.dia[slug] = dias[Math.min(dias.length-1, Math.max(0, dias.indexOf(S.dia[slug]) + n))];
  render();
}

/* ===== Piezas de la pantalla ===== */
function htmlTabla(filas, titulo){
  const ley = [], vistos = {};
  filas.forEach(f => { if(f.nota && !vistos[f.nota.d]){ vistos[f.nota.d] = 1; ley.push(f.nota); } });
  const th = (sig, t, c = '') => `<th scope="col" class="${c}"><abbr title="${t}">${sig}</abbr></th>`;
  return `<div class="tw"><table><caption class="sr">${esc(titulo)}</caption><thead><tr>
    ${th('#', 'Posición')}<th scope="col">Equipo</th>${th('PJ', 'Partidos jugados')}${th('G', 'Ganados')}${th('E', 'Empatados')}
    ${th('P', 'Perdidos')}${th('GF', 'Goles a favor', 'gf')}${th('GC', 'Goles en contra', 'gf')}${th('DG', 'Diferencia de gol')}${th('Pts', 'Puntos')}
    </tr></thead><tbody>` +
    filas.map((t, i) => `<tr><td${t.nota ? ` style="box-shadow:inset 6px 0 ${color(t.nota.c)}"` : ''}>${i+1}${t.nota ? `<span class="sr"> (${esc(t.nota.d)})</span>` : ''}</td>
      <td>${esc(t.n)}</td><td>${t.pj}</td><td>${t.g}</td><td>${t.e}</td><td>${t.p}</td>
      <td class="gf">${t.gf}</td><td class="gf">${t.gc}</td><td>${t.dg>0?'+':''}${t.dg}</td><td>${t.pts}</td></tr>`).join('') +
    `</tbody></table></div>` +
    (ley.length ? `<div class="ley">${ley.map(n => `<span><i style="background:${color(n.c)}"></i>${esc(n.d)}</span>`).join('')}</div>` : '');
}

// Goleadores de un lado del partido: "Nombre 23', 45' (p)"
function golesDe(p, lado){
  const por = {};
  (p.goles || []).filter(g => g.l === lado).forEach(g => {
    const n = g.n || 'Gol';
    (por[n] = por[n] || []).push(g.m + (g.t === 'p' ? ' (p)' : g.t === 'e' ? ' (e.c.)' : ''));
  });
  return Object.entries(por).map(([n, m]) => `${esc(n)} ${esc(m.join(', '))}`).join('<br>');
}

function htmlPartido(p){
  const jug = p.estado !== 'pre', gl = jug && +p.gl > +p.gv, gv = jug && +p.gv > +p.gl;
  const enjuego = p.estado === 'in', susp = p.estado === 'post' && !p.completo;
  const hora = new Date(p.fecha).toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit', hourCycle:'h23'});   // 21:30, no 9:30 p. m.
  const centro = susp ? '–' : jug ? `<span class="sr">Resultado: </span>${p.gl} - ${p.gv}` : `<span class="sr">Comienza a las </span>${hora}`;
  const estado = enjuego ? `<i class="punto"></i>En vivo ${esc(p.detalle)}` : susp ? esc(p.detalle) : jug ? 'Final' : '';
  const gH = golesDe(p, 'h'), gV = golesDe(p, 'v');
  return `<li class="mw ${enjuego ? 'envivo' : ''}"><div class="m"><span class="eq h ${gl?'w':''}">${esc(p.h)}</span>
    <span class="sc ${jug && !susp ? '' : 'next'}">${centro}${estado ? `<small class="est ${enjuego ? 'vivo' : ''}">${estado}</small>` : ''}</span>
    <span class="eq ${gv?'w':''}">${esc(p.v)}</span></div>` +
    (gH || gV ? `<div class="g"><span class="h">${gH}</span><span></span><span>${gV}</span></div>` : '') + `</li>`;
}

/* ===== Pantalla ===== */
let menuHecho = -1;
function menuLigas(){
  if(menuHecho === S.liga) return;   // no se redibuja el menú en cada refresco
  menuHecho = S.liga;
  const l = LIGAS[S.liga];
  document.getElementById('ligaBtn').innerHTML = `<span class="cod">${l.cod}</span><span class="nom">${esc(l.n)}</span><span class="flecha" aria-hidden="true"></span>`;
  document.getElementById('ligaBtn').setAttribute('aria-label', `Liga: ${l.n}. Cambiar de liga`);
  let grupo = '', h = '';
  LIGAS.forEach((x, i) => {
    if(x.g !== grupo){ grupo = x.g; h += `<p class="grupo">${esc(grupo)}</p>`; }
    h += `<button class="op ${i === S.liga ? 'on' : ''}" ${i === S.liga ? 'aria-current="true"' : ''} onclick="elegirLiga(${i})"><span class="cod">${x.cod}</span>${esc(x.n)}</button>`;
  });
  document.getElementById('ligaLista').innerHTML = h;
}
function abrirMenu(abrir){
  document.getElementById('ligaBtn').setAttribute('aria-expanded', String(abrir));
  document.getElementById('ligaLista').hidden = !abrir;
}
function elegirLiga(i){
  S.liga = i; abrirMenu(false); render();
  document.getElementById('ligaBtn').focus();
}

function render(){
  const tk = ++S.tk, slug = LIGAS[S.liga].espn, main = document.getElementById('contenido');
  menuLigas();
  document.querySelector('.liga-menu').hidden = S.vista === 'inicio';
  const cab = `<h2 class="sr">${S.vista === 'inicio' ? 'Inicio' : esc(LIGAS[S.liga].n)}</h2><div class="seg" role="group" aria-label="Qué querés ver">
    <button data-k="v0" aria-pressed="${S.vista === 'inicio'}" onclick="S.vista='inicio';render()">Inicio</button>
    <button data-k="v1" aria-pressed="${S.vista === 'partidos'}" onclick="S.vista='partidos';render()">Partidos</button>
    <button data-k="v2" aria-pressed="${S.vista === 'tabla'}" onclick="S.vista='tabla';render()">Posiciones</button></div>`;
  if(S.vista !== 'inicio' && !cache[slug]){ main.innerHTML = cab + '<p class="nota" role="status">Cargando datos…</p>'; main._h = ''; }
  cargar(cab, tk, slug);
}

async function cargar(cab, tk, slug){
  let h = cab, activo = false;
  try{
    if(S.vista === 'inicio'){
      const hoy = iso(new Date()), partidos = [];
      await Promise.all(LIGAS.map(async liga => {
        try{
          const D = await datosLiga(liga.espn);
          D.partidos.filter(p => p.dia === hoy).forEach(p => partidos.push({...p, liga:liga.n}));
        }catch(e){ /* Una competición sin datos no impide mostrar las demás. */ }
      }));
      partidos.sort((a, b) => String(a.fecha).localeCompare(String(b.fecha)));
      h += partidos.length ? `<div class="fecha"><div><h3>Hoy</h3><span>${new Date(hoy+'T12:00').toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'long'})}</span></div></div>` +
        partidos.map(p => `<p class="nota"><b>${esc(p.liga)}</b></p><ul class="lista">${htmlPartido(p)}</ul>`).join('') :
        '<p class="nota" role="status">Hoy no hay partidos programados.</p>';
    } else {
    const D = await datosLiga(slug);
    if(S.vista === 'partidos'){
      const dias = D.dias;
      if(!dias.length){ h += '<p class="nota" role="status">Todavía no hay partidos cargados para esta liga.</p>'; }
      else {
        if(!dias.includes(S.dia[slug])) S.dia[slug] = dias.find(d => d >= iso(new Date())) || dias[dias.length-1];
        const dia = S.dia[slug], i = dias.indexOf(dia), {etiqueta, txt} = diaTexto(dia);
        h += `<div class="fecha">
          <button data-k="d1" onclick="irDia(-1)" aria-label="Día anterior con partidos" ${i===0?'disabled':''}>‹</button>
          <div><h3>${etiqueta || txt}</h3><span>${etiqueta ? txt : ''}</span></div>
          <button data-k="d2" onclick="irDia(1)" aria-label="Día siguiente con partidos" ${i===dias.length-1?'disabled':''}>›</button></div>`;
        const envivo = esReciente(dia) ? await vivoPartidos(slug, dia) : null;
        h += '<ul class="lista">' + (envivo || D.partidos.filter(p => p.dia === dia)).map(htmlPartido).join('') + '</ul>';
        activo = hayActividad([...D.partidos, ...(envivo || [])]);
      }
    } else {
      const tv = await vivoTabla(slug);
      const anual = D.anual ? (await anualEnVivo(D, slug) || D.anual) : null;
      activo = hayActividad(D.partidos);
      if(D.anual){
        h += `<div class="seg chico" role="group" aria-label="Tipo de tabla">` + [['torneo','Torneo actual'],['anual','Tabla anual']].map(([k,t]) =>
          `<button data-k="s-${k}" aria-pressed="${S.sub === k}" onclick="S.sub='${k}';render()">${t}</button>`).join('') + `</div>`;
      }
      if(D.anual && S.sub === 'anual'){
        h += htmlTabla(anual, 'Tabla anual') + `<p class="nota">Suma la fase regular del Apertura y del Clausura (los playoffs no cuentan).
          * Los cupos se corren si algún equipo ya clasificó por otra vía (campeones, Copa Argentina). También desciende el último
          de la tabla de promedios; si es el mismo equipo, baja el anteúltimo de la anual.</p>`;
      } else {
        h += (tv || D.tabla).map(g => (g.nombre ? `<p class="nota"><b>${esc(g.nombre)}</b></p>` : '') + htmlTabla(g.filas, g.nombre || 'Posiciones')).join('');
      }
    }
    h += `<p class="nota">Datos de ESPN. Última novedad: ${new Date(D.actualizado).toLocaleString('es-AR')}.</p>`;
    }
  } catch(err){
    h += `<p class="nota" role="status">No se pudieron cargar los datos (${esc(err.message)}). Esto solo funciona con la página publicada en GitHub Pages, no abriendo el archivo con doble click.</p>`;
  }
  if(tk === S.tk){
    const main = document.getElementById('contenido');
    if(main._h !== h){   // si no cambió nada, no se toca la pantalla: así no se pierde el foco ni parpadea
      const foco = document.activeElement?.dataset?.k;
      main.innerHTML = h; main._h = h;
      if(foco) document.querySelector?.(`[data-k="${foco}"]`)?.focus();
    }
    if(PROXY) programar(activo ? 20000 : 60000);
  }
}

// Cada 60 segundos revisa si hay datos nuevos y, si los hay, redibuja sola
setInterval(async () => {
  if(document.hidden) return;
  const slug = LIGAS[S.liga].espn;
  try{
    const r = await fetch(`datos/${slug}.json`, {cache:'no-cache'});
    if(!r.ok) return;
    const raw = await r.text();
    if(raw !== cache[slug]?.raw){ cache[slug] = armar(raw); render(); }
  } catch(e){}
}, 60000);

document.getElementById('ligaBtn').addEventListener('click', () =>
  abrirMenu(document.getElementById('ligaBtn').getAttribute('aria-expanded') !== 'true'));
document.addEventListener('click', e => { if(!e.target.closest('.liga-menu')) abrirMenu(false); });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ abrirMenu(false); document.getElementById('ligaBtn').focus(); }
});

render();
</script>
</body>
