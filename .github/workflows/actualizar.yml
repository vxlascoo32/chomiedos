name: Actualizar datos

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      historial:
        description: 'Bajar toda la temporada (solo la primera vez o al sumar una liga)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bajar datos de ESPN
        run: python actualizar.py ${{ inputs.historial && '--historial' || '' }}
      - name: Guardar cambios
        run: |
          git config user.name "actualizador"
          git config user.email "actions@users.noreply.github.com"
          git add datos
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Actualizar datos"
          git pull --rebase
          git push
